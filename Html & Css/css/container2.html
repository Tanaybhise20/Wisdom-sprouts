<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container2</title>
    <style>
        .container{
            display: flex;
            width: 100%;
            background-color: darkblue;
            padding: 10px 10px;
            box-sizing: border-box;
            justify-content: flex-start;
        }
        .light-blue{
            background-color:  lightblue;
            flex: 1;
            margin: 2px 0;
            padding: 30px 40px;
            font-family: Arial, Helvetica, sans-serif;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="light-blue">Child</div>
        <div class="light-blue">Child</div>
        <div class="light-blue">Child</div>
    </div>
</body>
</html>
