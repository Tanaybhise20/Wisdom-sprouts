<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instaform </title>
    <link rel="stylesheet" href="instaform.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side: Promotional Panel -->
        <div class="panel-left">
            <div class="brand-logo">
                <!-- Replace with an actual Instagram SVG or image path -->
                <img src="./assets/instalogo.avif" alt="Instagram">
            </div>
            <h1>See everyday moments from your <span>close friends.</span></h1>
            <div class="promo-image">
                <!-- Replace with your collage or mockup image -->
                <img src="./assets/insta.avif" alt="Mockup">
            </div>
        </div>

        <!-- Right Side: Login Form Panel -->
        <div class="panel-right">
            <div class="form-box">
                <h2>Log in to Instagram</h2>
                
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="Phone number, username, or email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    
                    <button type="submit" class="login-btn">Log In</button>
                </form>

                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <button class="fb-login-btn">
                    <!-- Icon placeholder -->
                    <span class="fb-icon">f</span> Log in with Facebook
                </button>

                <button class="signup-link">
                     <a href="#">create new account</a>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
