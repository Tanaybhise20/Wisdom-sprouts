<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container3</title>
    <style>
         .Container3{
            display: flex;
            width: 100%;
            background-color: darkblue;
            padding: 10px 10px;
            box-sizing: border-box;
            justify-content: flex-start;
            align-items: center;
        }
        .light-blue{
            background-color:  lightblue;
            flex: 1;
            margin: 2px 0;
            padding: 30px 40px;
            font-family: Arial, Helvetica, sans-serif;
            color: black;
        }
        .olive-green{
            background-color: rgb(26, 62, 26);
            min-width: 50%;
            padding: 30px 40px;
        }
    </style>
</head>
<body>
     <div class="Container3">
        <div class="light-blue">Child</div>
        <div class="light-blue">Child</div>
        <div class="olive-green">Child</div>
    </div>
</body>
</html>
