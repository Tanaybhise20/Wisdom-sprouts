<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./registrationform.css">
</head>
<body>
    <div class="form-container">
        <h2>Registration</h2>
        <p class="sec-title">Personal Details</p>
        <form>
            <div class="form-grid">
                <div class="form-group">
                   <label for="full name">Full Name</label>
                   <input type="text" id="full-name" placeholder="Enter full name">
                </div>
                 <div class="form-group">
                   <label for="">Date of Birth</label>
                   <input type="date" >
                </div>
                 <div class="form-group">
                   <label for="">Email</label>
                   <input type="email" >
                </div>
                 <div class="form-group">
                   <label for="">Mobile-no</label>
                   <input type="tel" >
                </div>
                 <div class="form-group">
                   <label for="">Gender</label>
                   <input type="text" name="Gender" placeholder="Enter your Gender"> 
                </div>
                 <div class="form-group">
                   <label for="full name">Occupation</label>
                   <input type="text" id="full-name" placeholder="Enter Occupation">
                </div>
            </div>
            <p class="sec-title">Identity Details</p>
            <div class="form-grid">
                <div class="form-group">
                    <label for="">ID type</label>
                    <input type="text" placeholder="Enter ID Type">
                </div>
                <div class="form-group">
                    <label for="">ID Number</label>
                    <input type="text" placeholder="Enter ID Number">
                </div>
                <div class="form-group">
                    <label for="">Issue Authority</label>
                    <input type="text" placeholder="Enter issue department">
                 </div>
                 <div class="form-group">
                    <label for="">Issue Date</label>
                    <input type="text" placeholder="Enter ID issue date">
                 </div>
                 <div class="form-group">
                    <label for="">Issue state</label>
                    <input type="text" placeholder="Enter ID issue state">
                 </div>
                 <div class="form-group">
                    <label for="">Expiry Date</label>
                    <input type="text" placeholder="Enter ID expiry date">
                </div>
            </div>
            <button type="submit" class="submit-btn">Next &rarr;</button>
        </form>
    </div>
</body>
</html>
