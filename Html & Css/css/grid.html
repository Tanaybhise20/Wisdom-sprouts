<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 200px);
            gap: 10px;
        }
        .Grapes{
            background-color: purple;
        }
        .Staberry{
            background-color: pink;
        }
        .watermelon{
            background-color: green;
        }
        .orange{
            background-color: orange;
        }
        .papaya{
            background-color: yellow;
        }
        .pineapple{
            background-color: goldenrod;
        }
</head>
<body>
    <div class="container">
        <div class="Grapes">
            <img src="" alt=</div>
        <div class="Staberry">
            <img src="" alt=""></div>
        <div class="watermelon">
            <img src="" alt=""></div>
        <div class="orange">
            <img src="" alt=""></div>
        <div class="papaya">
            <img src="" alt=""></div>
        <div class="pineapple">
            <img src="" alt=""></div>
    </div>
</body>
</html>
